# AudioOutputSwitcher.ini
# Neutral release defaults. Configure shortcuts from Hotkey settings after installation.

ShowBalloon=true
RunAsAdministrator=false
AllowInjectedInput=false

# Examples:
# Next=Ctrl+Alt+F12
# Previous=Ctrl+Alt+F11
# Device1=Ctrl+Alt+1
# Name:Headphones=Ctrl+Alt+H
# Device shortcuts created in the settings UI are stored by stable device ID.
